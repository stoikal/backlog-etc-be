services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backlog_etc
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d backlog_etc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/backlog_etc
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: