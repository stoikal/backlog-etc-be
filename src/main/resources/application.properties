spring.application.name=backlog
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.config.import=file:.env[.properties]

# ----------------------------
# JPA & Hibernate Configuration
# ----------------------------

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Specifies the SQL dialect Hibernate should use.
# Ensures compatibility with PostgreSQL-specific SQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
# default to 15 mins
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:90000}
# default to 7 days
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

logging.level.org.flywaydb=DEBUG
